[package]
name = "gcode-viewer"
version = "0.1.0"
edition = "2024"
description = "A fast 3D G-code toolpath viewer with optional shading and shadows"
license = "GPL-3.0-only"
repository = "https://github.com/Gren-95/gcode-viewer"
keywords = ["gcode", "3d-printing", "viewer", "wgpu", "egui"]
categories = ["visualization"]

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
eframe = { version = "0.36.2", default-features = false, features = ["wgpu", "wayland", "x11", "default_fonts"] }
glam = "0.30"
rfd = "0.17.2"
